<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Library Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="icon">📚</div>
        <h1>Online Library Management System</h1>
        <p>Automate library operations with role-based access</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <p class="error-msg" id="errorMsg" style="display:none"></p>
        <div class="demo-accounts">
          <strong>Demo Accounts:</strong><br>
          Librarian: librarian@library.com / librarian123<br>
          User: user@library.com / user123
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = API.getUser();
    if (user && API.getToken()) {
      window.location.href = user.role === 'librarian' ? '/librarian.html' : '/user.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';

      try {
        const data = await API.request('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });

        API.setSession(data.token, data.user);
        window.location.href = data.user.role === 'librarian' ? '/librarian.html' : '/user.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
